name: hydroponic
services:
  neo4j:
    image: neo4j:5.26
    container_name: hydroponic-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-logs:/logs
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: hydroponic-api:local
    container_name: hydroponic-api
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      HYDRO_REAL_ONLY: "1"
      HYDRO_DATA_DIR: /app/data
      HYDRO_MQTT_CONFIG: /app/backend/config/mqtt.yaml
      HYDRO_ENV_FILE: /app/.env.local
      YOLO_MODEL_PATH: /app/backend/models/tomato-v1.pt
      YOLO_DEVICE: cpu
      HYDRO_OLLAMA_URL: ${HYDRO_OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      HYDRO_LLM_MODEL: ${HYDRO_LLM_MODEL:-qwen3.5:4b}
    volumes:
      - ./data/app:/app/data
      - ./.env:/app/.env.local
      - ./backend/config:/app/backend/config
      - ./backend/models:/app/backend/models:ro
    ports:
      - "127.0.0.1:8016:8016"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: hydroponic-web:local
    container_name: hydroponic-web
    ports:
      # Published on every interface: the host IP changes when the PC joins the camera hotspot,
      # and a hard-coded address would make `docker compose up` fail to bind.
      - "5176:80"
      - "5173:80"
      - "500:500"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
