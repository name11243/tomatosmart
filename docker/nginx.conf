server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;
    location /api/ {
        proxy_pass http://api:8016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Dedicated hardware ingress port in the existing web container.
# It exposes only the photo endpoint; browser/API traffic stays on port 80.
server {
    listen 500;
    server_name _;
    client_max_body_size 9m;
    client_body_timeout 30s;
    location = /snapshot {
        proxy_pass http://api:8016/snapshot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}
